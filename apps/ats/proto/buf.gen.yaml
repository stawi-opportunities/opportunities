version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/stawi-opportunities/opportunities/apps/ats/gen
    # Match the module already used by this monorepo (avoids dual registration).
    - file_option: go_package
      module: buf.build/antinvestor/common
      value: buf.build/gen/go/antinvestor/common/protocolbuffers/go/common/v1;commonv1
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../gen
    opt:
      - paths=source_relative
