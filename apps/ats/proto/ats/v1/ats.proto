syntax = "proto3";

package ats.v1;

option go_package = "github.com/stawi-opportunities/opportunities/apps/ats/gen/ats/v1;atsv1";

// AtsService is the employer ATS API.
// Connect path: /ats.v1.AtsService/<Method>
// SPA and agents share this surface (JSON Connect protocol).
service AtsService {
  // Dashboard aggregates open jobs, pipeline, and upcoming interviews.
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);

  // SeedDemo creates sample jobs/talent/availability when the partition is empty (dev).
  rpc SeedDemo(SeedDemoRequest) returns (SeedDemoResponse);

  // Jobs
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
  rpc CloseJob(CloseJobRequest) returns (CloseJobResponse);
  rpc PublishJob(PublishJobRequest) returns (PublishJobResponse);
  rpc UnpublishJob(UnpublishJobRequest) returns (UnpublishJobResponse);

  // Pipeline
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse);
  rpc CreateApplication(CreateApplicationRequest) returns (CreateApplicationResponse);
  rpc GetApplication(GetApplicationRequest) returns (GetApplicationResponse);
  rpc AdvanceApplication(AdvanceApplicationRequest) returns (AdvanceApplicationResponse);
  rpc HireApplication(HireApplicationRequest) returns (HireApplicationResponse);

  // Stawi talent source
  rpc ListTalent(ListTalentRequest) returns (ListTalentResponse);
  rpc AddTalent(AddTalentRequest) returns (AddTalentResponse);

  // Interviews
  rpc ListInterviews(ListInterviewsRequest) returns (ListInterviewsResponse);
  rpc ProposeInterview(ProposeInterviewRequest) returns (ProposeInterviewResponse);
  rpc ListInterviewSlots(ListInterviewSlotsRequest) returns (ListInterviewSlotsResponse);
  rpc BookInterview(BookInterviewRequest) returns (BookInterviewResponse);
  rpc GetInterviewICS(GetInterviewICSRequest) returns (GetInterviewICSResponse);

  // Availability (acting profile)
  rpc GetMyAvailability(GetMyAvailabilityRequest) returns (GetMyAvailabilityResponse);
  rpc SetMyAvailability(SetMyAvailabilityRequest) returns (SetMyAvailabilityResponse);

  // Candidate portal
  rpc ListMyApplications(ListMyApplicationsRequest) returns (ListMyApplicationsResponse);

  // AI assist
  rpc ScreenSummary(ScreenSummaryRequest) returns (ScreenSummaryResponse);
}

// --- Domain messages ---

message Job {
  string id = 1;
  string tenant_id = 2;
  string partition_id = 3;
  string title = 4;
  string description = 5;
  string location = 6;
  string status = 7;      // draft|open|closed
  string visibility = 8;  // private|published
  string opportunity_id = 9;
  string published_at = 10; // RFC3339
  string created_at = 11;
  string updated_at = 12;
}

message Application {
  string id = 1;
  string job_id = 2;
  string profile_id = 3;
  string candidate_id = 4;
  string stage = 5;
  string source = 6;
  string source_ref = 7;
  string status = 8;
  string summary = 9;
  float score = 10;
  string created_at = 11;
  string updated_at = 12;
  string job_title = 13;
}

message Interview {
  string id = 1;
  string application_id = 2;
  string type = 3;
  int32 duration_min = 4;
  repeated string panel = 5;
  string status = 6;
  string slot_start = 7;
  string slot_end = 8;
  string location = 9;
  string video_url = 10;
  string ics_uid = 11;
  string job_id = 12;
  string job_title = 13;
  string candidate_profile_id = 14;
}

message TalentHit {
  string profile_id = 1;
  string candidate_id = 2;
  float score = 3;
  string summary = 4;
}

message WeekRule {
  int32 weekday = 1; // 0=Sunday … 6=Saturday
  string start = 2;  // HH:MM
  string end = 3;
}

message ExceptionDay {
  string date = 1; // YYYY-MM-DD
  bool blocked = 2;
}

message Availability {
  string profile_id = 1;
  string timezone = 2;
  repeated WeekRule rules = 3;
  repeated ExceptionDay exceptions = 4;
}

message Slot {
  string start = 1; // RFC3339
  string end = 2;
}

message HireOutcome {
  string id = 1;
  string application_id = 2;
  string job_id = 3;
  string profile_id = 4;
  string billing_ref = 5;
  string idempotency_key = 6;
  string created_at = 7;
}

message Dashboard {
  int32 open_jobs = 1;
  int32 active_applications = 2;
  int32 interviews_this_week = 3;
  repeated Interview upcoming_interviews = 4;
  repeated string needs_attention = 5;
}

// --- RPCs ---

message GetDashboardRequest {}
message GetDashboardResponse {
  Dashboard dashboard = 1;
}

message SeedDemoRequest {}
message SeedDemoResponse {
  bool seeded = 1;
  Dashboard dashboard = 2;
}

message ListJobsRequest {
  string status = 1;
}
message ListJobsResponse {
  repeated Job jobs = 1;
}

message CreateJobRequest {
  string title = 1;
  string description = 2;
  string location = 3;
  string status = 4;
}
message CreateJobResponse {
  Job job = 1;
}

message GetJobRequest {
  string id = 1;
}
message GetJobResponse {
  Job job = 1;
}

message UpdateJobRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string location = 4;
  optional string status = 5;
}
message UpdateJobResponse {
  Job job = 1;
}

message CloseJobRequest {
  string id = 1;
}
message CloseJobResponse {
  Job job = 1;
}

message PublishJobRequest {
  string id = 1;
}
message PublishJobResponse {
  Job job = 1;
}

message UnpublishJobRequest {
  string id = 1;
}
message UnpublishJobResponse {
  Job job = 1;
}

message ListApplicationsRequest {
  string job_id = 1;
  string stage = 2;
}
message ListApplicationsResponse {
  repeated Application applications = 1;
}

message CreateApplicationRequest {
  string job_id = 1;
  string profile_id = 2;
  string candidate_id = 3;
  string source = 4;
  string source_ref = 5;
  string summary = 6;
  float score = 7;
}
message CreateApplicationResponse {
  Application application = 1;
}

message GetApplicationRequest {
  string id = 1;
}
message GetApplicationResponse {
  Application application = 1;
}

message AdvanceApplicationRequest {
  string id = 1;
  string to_stage = 2;
  string note = 3;
}
message AdvanceApplicationResponse {
  Application application = 1;
}

message HireApplicationRequest {
  string id = 1;
}
message HireApplicationResponse {
  Application application = 1;
  HireOutcome hire_outcome = 2;
}

message ListTalentRequest {
  string job_id = 1;
  int32 limit = 2;
}
message ListTalentResponse {
  repeated TalentHit talent = 1;
}

message AddTalentRequest {
  string job_id = 1;
  TalentHit hit = 2;
}
message AddTalentResponse {
  Application application = 1;
}

message ListInterviewsRequest {
  string application_id = 1;
}
message ListInterviewsResponse {
  repeated Interview interviews = 1;
}

message ProposeInterviewRequest {
  string application_id = 1;
  string type = 2;
  int32 duration_min = 3;
  repeated string panel = 4;
  string location = 5;
  string video_url = 6;
}
message ProposeInterviewResponse {
  Interview interview = 1;
}

message ListInterviewSlotsRequest {
  string interview_id = 1;
}
message ListInterviewSlotsResponse {
  repeated Slot slots = 1;
}

message BookInterviewRequest {
  string interview_id = 1;
  string start = 2; // RFC3339
  string end = 3;
}
message BookInterviewResponse {
  Interview interview = 1;
}

message GetInterviewICSRequest {
  string interview_id = 1;
}
message GetInterviewICSResponse {
  string ics = 1;
}

message GetMyAvailabilityRequest {}
message GetMyAvailabilityResponse {
  Availability availability = 1;
}

message SetMyAvailabilityRequest {
  string timezone = 1;
  repeated WeekRule rules = 2;
  repeated ExceptionDay exceptions = 3;
}
message SetMyAvailabilityResponse {
  Availability availability = 1;
}

message ListMyApplicationsRequest {}
message ListMyApplicationsResponse {
  repeated Application applications = 1;
}

message ScreenSummaryRequest {
  string application_id = 1;
}
message ScreenSummaryResponse {
  string summary = 1;
}
