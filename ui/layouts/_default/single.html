{{ define "main" }}
{{ partial "breadcrumbs.html" . }}
<article class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="rounded-[2rem] bg-surface p-8 shadow-sm ring-1 ring-muted sm:p-10">
    <h1 class="text-3xl font-bold text-main">{{ .Title }}</h1>
    <div class="prose mt-8 max-w-none prose-a:text-accent-500 prose-a:font-semibold prose-blockquote:border-accent-500/40 prose-blockquote:bg-accent-500/10 prose-img:rounded-3xl dark:prose-invert">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
